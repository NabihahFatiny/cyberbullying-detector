<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CyberSafe Learning System{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:       #2563eb;
      --primary-dark:  #1d4ed8;
      --primary-light: #dbeafe;
      --danger:        #dc2626;
      --danger-light:  #fee2e2;
      --danger-dark:   #991b1b;
      --success:       #16a34a;
      --success-light: #dcfce7;
      --warning:       #d97706;
      --warning-light: #fef3c7;
      --amber:         #f59e0b;
      --purple:        #7c3aed;
      --purple-light:  #ede9fe;
      --gray-50:       #f9fafb;
      --gray-100:      #f3f4f6;
      --gray-200:      #e5e7eb;
      --gray-300:      #d1d5db;
      --gray-400:      #9ca3af;
      --gray-500:      #6b7280;
      --gray-600:      #4b5563;
      --gray-700:      #374151;
      --gray-800:      #1f2937;
      --gray-900:      #111827;
      --header-bg:     #0f172a;
      --card-shadow:   0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
      --card-shadow-lg:0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
      --radius:        12px;
      --radius-sm:     8px;
      --radius-lg:     16px;
      --transition:    all .25s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      line-height: 1.6;
      min-height: 100vh;
    }

    .hidden { display: none !important; }
    .mt-8  { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }

    a { color: inherit; }

    /* ── Top Nav ───────────────────────────────────────────────── */
    #site-nav {
      background: var(--header-bg);
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky;
      top: 0;
      z-index: 500;
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-links {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 100px;
      font-size: .82rem;
      font-weight: 600;
      color: #94a3b8;
      text-decoration: none;
      transition: var(--transition);
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.06); }
    .nav-link.active { color: #fff; background: rgba(37,99,235,.35); }

    /* ── Generic page header (each page fills in its own text) ──── */
    .page-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(37,99,235,.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(124,58,237,.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .page-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 36px;
      position: relative;
      z-index: 1;
    }
    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37,99,235,.3);
      border: 1px solid rgba(37,99,235,.5);
      color: #93c5fd;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
    }
    .page-header h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header p.subtitle {
      font-size: 1rem;
      color: #94a3b8;
      max-width: 640px;
      font-weight: 400;
    }

    /* ── Shared card component (used across new pages) ───────────── */
    .card {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--card-shadow-lg); }
    .card-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-icon.blue   { background: var(--primary-light); }
    .card-icon.purple { background: var(--purple-light); }
    .card-icon.green  { background: var(--success-light); }
    .card-icon.amber  { background: var(--warning-light); }
    .card-header h2 { font-size: 1rem; font-weight: 700; color: var(--gray-900); }
    .card-header p  { font-size: .8rem; color: var(--gray-500); margin-top: 1px; }
    .card-body { padding: 24px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 24px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,.45); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }
    .btn-secondary:hover { background: var(--gray-200); color: var(--gray-800); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    footer {
      background: var(--header-bg);
      color: #64748b;
      text-align: center;
      padding: 24px;
      font-size: .8rem;
    }
    footer strong { color: #94a3b8; }

    {% block extra_style %}{% endblock %}
  </style>
</head>

<body>
  <nav id="site-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ url_for('home') }}">🛡️ CyberSafe Learning System</a>
      <div class="nav-links">
        <a class="nav-link {{ 'active' if request.path == '/' else '' }}" href="{{ url_for('home') }}">🏠 Home</a>
        <a class="nav-link {{ 'active' if request.path == '/lessons' else '' }}" href="{{ url_for('lessons') }}">📚 Lessons</a>
        <a class="nav-link {{ 'active' if request.path == '/scenarios' else '' }}" href="{{ url_for('scenarios') }}">💬 Scenarios</a>
        <a class="nav-link {{ 'active' if request.path == '/myths' else '' }}" href="{{ url_for('myths') }}">🃏 Myth or Fact</a>
        <a class="nav-link {{ 'active' if request.path == '/detector' else '' }}" href="{{ url_for('detector') }}">🔍 Detector</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    <strong>CyberSafe Learning &amp; Cyberbullying Detection System</strong>
    <div style="margin-top:10px;font-size:.72rem;">
      For educational and research purposes only.
    </div>
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
