version: "1"
services:
  - type: web
    name: cyberbullying-detector-ultimate
    env: python
    plan: free
    runtime: python3.11
    buildCommand: pip install flask && echo "Build complete"
    startCommand: python app.py
    healthCheckPath: /
    healthCheckTimeout: 30
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "5000"
      - key: FLASK_ENV
        value: "production"
